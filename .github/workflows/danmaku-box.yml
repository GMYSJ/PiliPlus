name: Build with Danmaku Box

# 用法：Actions -> 选这个工作流 -> Run workflow
#   upstream_tag: 只填版本号，如 2.2.0.2；留空 = 自动取上游最新 release
#   make_release: 勾上则创建一个 Release 并把 APK 挂上去
#
# 原理：先 checkout 上游那个 tag 的干净源码，再把你 fork 里的 4 个改动文件盖上去，
#      然后编译 Android。上游升版不用手动 merge。

on:
    workflow_dispatch:
        inputs:
            upstream_tag:
                description: '上游版本号（留空=自动取最新 release，例如 2.2.0.2）'
                required: false
                default: ''
                type: string
            source_ref:
                description: '从哪个分支取这 4 个改动文件'
                required: false
                default: 'feature/landscape-danmaku-input'
                type: string
            make_release:
                description: '创建 Release 并上传 APK'
                required: false
                default: false
                type: boolean

    # 也允许在 push 到本分支时自动编一次（方便验证）
    # push:
    #     branches: [ feature/landscape-danmaku-input ]

env:
    # 你的改动集中在这 4 个文件，编译前会从本分支覆盖到上游源码上
    PATCH_FILES: >-
        lib/pages/live_room/controller.dart
        lib/pages/live_room/widgets/bottom_control.dart
        lib/pages/live_room/widgets/header_control.dart
        lib/plugin/pl_player/controller.dart
        .signing/pili.p12.b64

jobs:
    build:
        name: Android (原版 + 弹幕框)
        runs-on: ubuntu-latest
        permissions: write-all

        steps:
            - name: 迁出本仓库
              uses: actions/checkout@v7
              with:
                  fetch-depth: 0

            - name: 记录自己的改动文件
              env:
                  SRC_REF: ${{ github.event.inputs.source_ref || 'feature/landscape-danmaku-input' }}
              run: |
                  SRC_REF="${SRC_REF:-feature/landscape-danmaku-input}"
                  git fetch origin "$SRC_REF" --force
                  echo "从 origin/$SRC_REF 取改动文件"
                  mkdir -p /tmp/patchsrc
                  for f in $PATCH_FILES; do
                    mkdir -p "/tmp/patchsrc/$(dirname "$f")"
                    git show "origin/$SRC_REF:$f" > "/tmp/patchsrc/$f"
                    echo "saved: $f ($(wc -l < "/tmp/patchsrc/$f") 行)"
                  done

            - name: 拉取上游并确定版本
              id: ver
              run: |
                  git remote add upstream https://github.com/bggRGjQaUbCoE/PiliPlus.git 2>/dev/null || true
                  git fetch upstream --tags --force

                  TAG="${{ github.event.inputs.upstream_tag }}"
                  if [ -z "$TAG" ]; then
                    TAG=$(curl -s https://api.github.com/repos/bggRGjQaUbCoE/PiliPlus/releases/latest \
                          | grep -m1 '"tag_name"' | sed -E 's/.*"tag_name": *"([^"]+)".*/\1/')
                    echo "自动取到最新 release: $TAG"
                  fi
                  if [ -z "$TAG" ]; then
                    echo "::error::无法确定上游版本，请手动填写 upstream_tag"
                    exit 1
                  fi
                  if ! SHA=$(git rev-parse "refs/tags/$TAG^{commit}" 2>/dev/null); then
                    echo "::error::上游不存在 tag: $TAG"
                    echo "可用 tag 示例："; git tag --sort=-creatordate | head -10
                    exit 1
                  fi
                  echo "tag=$TAG"  >> "$GITHUB_OUTPUT"
                  echo "sha=$SHA"  >> "$GITHUB_OUTPUT"
                  echo "使用上游版本: $TAG ($SHA)"

            - name: 切到上游干净源码 + 覆盖改动
              run: |
                  SHA='${{ steps.ver.outputs.sha }}'
                  git checkout -B build "$SHA"
                  for f in $PATCH_FILES; do
                    cp "/tmp/patchsrc/$f" "$f"
                    echo "overlaid: $f"
                  done
                  echo "--- 覆盖后相对上游的差异 ---"
                  git --no-pager diff --stat '${{ steps.ver.outputs.sha }}'

            - name: 构建 Java 环境
              uses: actions/setup-java@v5
              with:
                  distribution: 'zulu'
                  java-version: '17'
                  cache: 'gradle'
                  cache-dependency-path: |
                      android/*.gradle*
                      android/**/gradle-wrapper.properties

            - name: 安装 Flutter
              uses: subosito/flutter-action@v2
              with:
                  channel: stable
                  flutter-version-file: pubspec.yaml
                  cache: true

            - name: Apply Patch
              shell: pwsh
              run: lib/scripts/patch.ps1 android

            - name: 写入签名（固定密钥，保证可覆盖安装）
              run: |
                  set -e
                  STORE_FILE=""
                  STORE_PASS=""
                  ALIAS=""
                  KEY_PASS=""

                  if [ -n "${{ secrets.SIGN_KEYSTORE_BASE64 }}" ]; then
                    echo "${{ secrets.SIGN_KEYSTORE_BASE64 }}" | base64 -d > android/app/key.jks
                    STORE_FILE="key.jks"
                    STORE_PASS="${{ secrets.KEYSTORE_PASSWORD }}"
                    ALIAS="${{ secrets.KEY_ALIAS }}"
                    KEY_PASS="${{ secrets.KEY_PASSWORD }}"
                    echo "✅ 使用仓库 Secrets 里的签名"
                  elif [ -f .signing/pili.p12.b64 ]; then
                    base64 -d .signing/pili.p12.b64 > android/app/key.p12
                    STORE_FILE="key.p12"
                    STORE_PASS="PiliPlusPersonalBuild"
                    ALIAS="pili"
                    KEY_PASS="PiliPlusPersonalBuild"
                    echo "✅ 使用仓库内置固定签名（跨版本可覆盖安装）"
                  else
                    echo "::warning::没有签名材料，将退回 Flutter 调试签名（不同构建之间无法覆盖安装）"
                    exit 0
                  fi

                  cat > android/key.properties <<EOF
                  storeFile=$STORE_FILE
                  storePassword=$STORE_PASS
                  keyAlias=$ALIAS
                  keyPassword=$KEY_PASS
                  EOF
                  sed -i 's/^ *//' android/key.properties
                  echo "--- key.properties ---"; cat android/key.properties

            - name: Set and Extract version
              shell: pwsh
              run: lib/scripts/build.ps1 android

            - name: 编译 APK
              run: |
                  flutter pub get
                  flutter build apk --release --split-per-abi \
                    --dart-define-from-file=pili_release.json --no-pub

            - name: 重命名
              run: |
                  for f in build/app/outputs/flutter-apk/app-*-release.apk; do
                    abi=$(echo "$f" | sed -E 's|.*app-(.*)-release\.apk|\1|')
                    mv "$f" "PiliPlus_${{ env.version }}_danmakubox_${abi}.apk"
                  done
                  ls -lh PiliPlus_*.apk

            - name: 上传产物
              uses: actions/upload-artifact@v7
              with:
                  archive: false
                  name: PiliPlus-${{ steps.ver.outputs.tag }}-danmakubox
                  path: PiliPlus_*.apk

            - name: 创建 Release
              if: ${{ github.event.inputs.make_release == 'true' }}
              uses: softprops/action-gh-release@v3
              with:
                  tag_name: danmakubox-${{ steps.ver.outputs.tag }}
                  name: 弹幕框版 ${{ steps.ver.outputs.tag }}
                  body: |
                    基于上游 PiliPlus ${{ steps.ver.outputs.tag }}
                    已内置横屏底部弹幕输入框。
                  files: PiliPlus_*.apk
